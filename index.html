
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Pick'em - Week 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: white;
    color: #222;
    margin: 25px;
  }

  h2 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 18px;
  }

  .table-container {
    width: 100%;
    max-width: 1350px;
    margin: 0 auto;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    font-size: 14px;
    width: 100%;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 3px 5px;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: break-word;
  }

  th {
    background: #f2f2f2;
    font-weight: 600;
  }

  th:first-child, td:first-child {
    text-align: left;
    font-weight: 600;
    position: sticky;
    left: 0;
    background: white;
    width: 14%;
  }

  th {
    cursor: pointer;
    user-select: none;
  }
  
  th:hover {
    background: #e5e5e5;
  }
  
  th.sorted-asc::after {
    content: " ▲";
    font-size: 10px;
  }
  
  th.sorted-desc::after {
    content: " ▼";
    font-size: 10px;
  }

  th:first-child {
    background: #f2f2f2;
  }

  tr:nth-child(even) td {
    background: #fafafa;
  }

  tr:nth-child(even) td:first-child {
    background: #fafafa;
  }

  /* Equal widths for game columns */
  .game-column {
    width: 5.5%;
  }

  /* Narrower confidence columns */
  .conf-column {
    width: 3.5%;
  }

  .tally-table {
    margin-top: 12px;
  }

  .wildcards {
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 18px;
    margin-left: 8px;
  }

  #week-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
  }
  
  a.player-link, a.player-link:visited, a.player-link:hover, a.player-link:active {
    color: #222;
    text-decoration: none;
  }

  #week-nav a {
    color: #333;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }
  
  #week-nav a:hover {
    text-decoration: underline;
  }
  
  #week-nav a.active {
    font-weight: 700;
    text-decoration: underline;
  }

  @media (max-width: 700px) {
    body {
      margin: 12px;
    }

    table {
      min-width: 1050px;
    }
  }
</style>
</head>

<body>

<nav id="week-nav"></nav>
<h2 id="week-title">Week 1</h2>

<div id="table-container" class="table-container">
  Loading...
</div>


<script>
async function loadData() {
  const container = document.getElementById("table-container");

  const requestedWeek =
    new URLSearchParams(window.location.search).get("week") || "1";

  const weekNumber =
    /^\d+$/.test(requestedWeek) &&
    Number(requestedWeek) >= 1 &&
    Number(requestedWeek) <= 18
      ? Number(requestedWeek)
      : 1;

  const weekName = "Week " + weekNumber;

  try {
    const response = await fetch("data/data.json");

    if (!response.ok) {
      throw new Error("Unable to load spreadsheet data.");
    }

    const data = await response.json();

    const week = data.sheets.find(sheet => sheet.name === weekName);
    const users = data.sheets.find(sheet => sheet.name === "Users");

    if (!week) {
      throw new Error(weekName + " worksheet not found.");
    }

    // Update page heading
    document.getElementById("week-title").textContent = weekName;

    // Build week navigation
    const weekNav = document.getElementById("week-nav");

    weekNav.innerHTML = Array.from({ length: 18 }, (_, i) => {
      const number = i + 1;

      return `
        <a href="?week=${number}"
           class="${number === weekNumber ? 'active' : ''}">
           Week ${number}
        </a>
      `;
    }).join("");

    // Build username-to-last-name lookup
    const lastNames = {};

    if (users) {
      users.rows.forEach(row => {
        const username = String(row[0] || "").trim();
        const lastName = String(row[1] || "").trim();

        if (username && lastName) {
          lastNames[username] = lastName;
        }
      });
    }

    const playerUsername = new URLSearchParams(window.location.search).get("player");
    if (playerUsername) {
      buildPlayerPage(data, playerUsername, lastNames);
      return;
    }

    const rows = week.rows;

    // Calculate cumulative season scores by username
    const seasonTotals = {};

    for (let w = 1; w <= weekNumber; w++) {
      const previousWeek = data.sheets.find(
        sheet => sheet.name === `Week ${w}`
      );

      if (!previousWeek) continue;

      previousWeek.rows.forEach(playerRow => {
        const username = String(playerRow[0] || "").trim();
        const rawScore = String(playerRow[15] || "").trim();

        if (!username || rawScore === "") return;

        const score = Number(rawScore.replace(/,/g, ""));

        if (Number.isFinite(score)) {
          seasonTotals[username] =
            (seasonTotals[username] || 0) + score;
        }
      });
    }

    // Main table headers:
    // Last Name | Score | Season | Original columns B through O
    const headers = [
      "Last Name",
      "Score",
      "Season",
      ...week.headers.slice(1, 15)
    ];

    // Define column widths consistently
    function addColumnWidths() {
      headers.forEach((header, index) => {
        if (index === 0) {
          html += '<col style="width:14%">';
        } else if (index === 1) {
          html += '<col style="width:5%">';
        } else if (index === 2) {
          html += '<col style="width:6%">';
        } else if (index % 2 === 0) {
          html += '<col class="conf-column">';
        } else {
          html += '<col class="game-column">';
        }
      });
    }

    let html = "<table><colgroup>";

    addColumnWidths();

    html += "</colgroup><thead><tr>";

    // Build sortable column headings
    headers.forEach((header, index) => {
      html += `<th data-column="${index}">${escapeHTML(header)}</th>`;
    });

    html += "</tr></thead><tbody>";

    // Get winners and losers from the entire worksheet
    const winners = new Set();
    const losers = new Set();

    rows.forEach(row => {
      const winner = String(row[18] || "").trim();
      const loser = String(row[19] || "").trim();

      if (winner) winners.add(winner);
      if (loser) losers.add(loser);
    });

    // Build participant rows
    rows.forEach(row => {
      html += "<tr>";

      const username = String(row[0] || "").trim();

      for (let i = 0; i < 17; i++) {
        let value = "";
        let cellStyle = "";

        if (i === 0) {
          // Last Name
          value = lastNames[username] || username;

        } else if (i === 1) {
          // Weekly Score
          value = row[15] || "";

        } else if (i === 2) {
          // Cumulative Season Score
          value = seasonTotals[username] ?? 0;

        } else {
          // Original spreadsheet columns B through O
          value = row[i - 2] || "";
        }

        // Game picks and Wildcard pick
        const isPickColumn = [3, 5, 7, 9, 11, 13, 15].includes(i);

        if (isPickColumn && value) {
          const pick = String(value).trim();

          if (winners.has(pick)) {
            cellStyle = "background-color: #32c98d;";
          } else if (losers.has(pick)) {
            cellStyle = "background-color: #fc6799;";
          }
        }

        if (i === 0) {
          html += `<td style="${cellStyle}"><a class="player-link" href="?player=${encodeURIComponent(username)}">${escapeHTML(value)}</a></td>`;
        } else {
          html += `<td style="${cellStyle}">${escapeHTML(value)}</td>`;
        }
      }

      html += "</tr>";
    });

    html += "</tbody></table>";

    // Build Total Picks table
    const tallyGames = [
      { gameCol: 3, confCol: 4, teamCol: 22, countCol: 23 },
      { gameCol: 5, confCol: 6, teamCol: 24, countCol: 25 },
      { gameCol: 7, confCol: 8, teamCol: 26, countCol: 27 },
      { gameCol: 9, confCol: 10, teamCol: 28, countCol: 29 },
      { gameCol: 11, confCol: 12, teamCol: 30, countCol: 31 },
      { gameCol: 13, confCol: 14, teamCol: 32, countCol: 33 }
    ];

    // Tally data comes from spreadsheet rows 2 and 3
    const tallySourceRows = [
      rows[0] || [],
      rows[1] || []
    ];

    html += '<table class="tally-table"><colgroup>';

    addColumnWidths();

    html += '</colgroup><tbody>';

    tallySourceRows.forEach((sourceRow, rowIndex) => {
      html += '<tr>';

      for (let i = 0; i < 17; i++) {
        let value = "";

        // First cell of first row
        if (i === 0 && rowIndex === 0) {
          value = "Pick Distribution";
        }

        const game = tallyGames.find(g => g.gameCol === i);
        const conf = tallyGames.find(g => g.confCol === i);

        if (game) {
          value = sourceRow[game.teamCol] || "";
        } else if (conf) {
          value = sourceRow[conf.countCol] || "";
        }

        html += `<td>${escapeHTML(value)}</td>`;
      }

      html += '</tr>';
    });

    html += '</tbody></table>';

    // Display Wildcards from cell W5
    const wildcards = rows[3]?.[22] || "";

    html += `
      <p class="wildcards">
        <strong>Wildcards:</strong> ${escapeHTML(wildcards)}
      </p>
    `;

    // Display completed tables
    container.innerHTML = html;

    // Enable sorting on the main table
    const table = container.querySelector("table");
    const tableHeaders = table.querySelectorAll("th");

    let currentSortColumn = -1;
    let sortAscending = true;

    tableHeaders.forEach(header => {
      header.addEventListener("click", () => {
        const column = Number(header.dataset.column);

        if (currentSortColumn === column) {
          sortAscending = !sortAscending;
        } else {
          currentSortColumn = column;
          sortAscending = true;
        }

        const tbody = table.querySelector("tbody");
        const tableRows = Array.from(tbody.querySelectorAll("tr"));

        tableRows.sort((a, b) => {
          const valueA = a.cells[column].textContent.trim();
          const valueB = b.cells[column].textContent.trim();

          if (!valueA) return 1;
          if (!valueB) return -1;

          const numberA = Number(valueA);
          const numberB = Number(valueB);

          let comparison;

          if (
            valueA !== "" &&
            valueB !== "" &&
            !isNaN(numberA) &&
            !isNaN(numberB)
          ) {
            comparison = numberA - numberB;
          } else {
            comparison = valueA.localeCompare(valueB, undefined, {
              numeric: true,
              sensitivity: "base"
            });
          }

          return sortAscending ? comparison : -comparison;
        });

        tableRows.forEach(row => tbody.appendChild(row));

        tableHeaders.forEach(th => {
          th.classList.remove("sorted-asc", "sorted-desc");
        });

        header.classList.add(
          sortAscending ? "sorted-asc" : "sorted-desc"
        );
      });
    });

  } catch (error) {
    container.innerHTML =
      `<p style="color:#b00020">${escapeHTML(error.message)}</p>`;
  }
}


function formatRank(scores, score) {
  const numericScores = scores.map(Number).filter(Number.isFinite);
  const sortedScores = [...numericScores].sort((a, b) => b - a);
  const firstPosition = sortedScores.findIndex(value => value === Number(score)) + 1;
  const tiedCount = numericScores.filter(value => value === Number(score)).length;
  return tiedCount > 1 ? `T-${firstPosition}` : firstPosition;
}

function buildPlayerPage(data, username, lastNames) {
  const container = document.getElementById("table-container");
  const playerName = lastNames[username] || username;
  document.getElementById("week-title").textContent = playerName;
  document.getElementById("week-nav").innerHTML = `<a href="?week=1">← Back to standings</a>`;

  const weeks = data.sheets
    .filter(sheet => /^Week \d+$/.test(sheet.name))
    .sort((a, b) => Number(a.name.replace("Week ", "")) - Number(b.name.replace("Week ", "")));

  const playerWeeks = [];

  weeks.forEach(sheet => {
    const weekNum = Number(sheet.name.replace("Week ", ""));
    const rows = sheet.rows || [];

    // Use the same participant rows and Score column as the main standings.
    const participantRows = rows.filter(row => String(row[0] || "").trim() !== "");
    const playerRow = participantRows.find(row => String(row[0] || "").trim() === username);
    if (!playerRow) return;

    const weeklyScores = participantRows.map(row => {
      const rawScore = String(row[15] ?? "").trim();
      const score = Number(rawScore.replace(/,/g, ""));
      return Number.isFinite(score) ? score : 0;
    });

    const weeklyScore = Number(String(playerRow[15] ?? "0").replace(/,/g, "")) || 0;
    const weeklyRank = formatRank(weeklyScores, weeklyScore);

    // Match the main standings' Season column: sum Score (column 16)
    // from every week through the current week, by username.
    const seasonTotals = {};
    weeks.filter(w => Number(w.name.replace("Week ", "")) <= weekNum).forEach(w => {
      (w.rows || []).forEach(row => {
        const u = String(row[0] || "").trim();
        if (!u) return;

        const rawScore = String(row[15] ?? "").trim();
        const score = Number(rawScore.replace(/,/g, ""));
        if (!Number.isFinite(score)) return;

        seasonTotals[u] = (seasonTotals[u] || 0) + score;
      });
    });

    const seasonScores = Object.values(seasonTotals);
    const playerSeasonScore = seasonTotals[username] ?? 0;
    const seasonRank = formatRank(seasonScores, playerSeasonScore);

    const pickHeaders = [1,3,5,7,9,11,13].map(i => String(sheet.headers?.[i] || ""));
    const pickIndexes = [1,3,5,7,9,11,13];
    const spreadIndex = pickHeaders.findIndex(h => /[+-]\d+(?:\.\d+)?/.test(h));
    const wildcardIndex = pickHeaders.findIndex(h => /wild.?card|\bwc\b/i.test(h));
    // Wildcard and spread are separate columns: identify each from its own header.
    const spreadPos = spreadIndex >= 0 ? spreadIndex : -1;
    const wildcardPos = wildcardIndex >= 0 ? wildcardIndex : -1;
    const orderedPositions = pickIndexes.map((_, pos) => pos);

    const winners = new Set();
    const losers = new Set();
    rows.forEach(row => {
      const winner = String(row[18] || "").trim();
      const loser = String(row[19] || "").trim();
      if (winner) winners.add(winner);
      if (loser) losers.add(loser);
    });

    const picks = orderedPositions.map(pos => {
      let pick = String(playerRow[pickIndexes[pos]] || "").trim();
      const confidence = Number(playerRow[pickIndexes[pos] + 1]) || 0;
      const header = pickHeaders[pos] || `Gm${pos + 1}`;

      // Convert the spread into the selected team's perspective.
      if (pos === spreadPos && pick) {
        const matchup = header.match(/([A-Z]{2,3})\s*@\s*([A-Z]{2,3})\s*([+-]\d+(?:\.\d+)?)/i);
        if (matchup) {
          const away = matchup[1].toUpperCase();
          const home = matchup[2].toUpperCase();
          const line = Number(matchup[3]);
          const selected = pick.toUpperCase();
          const adjustedLine = selected === away ? -line : selected === home ? line : null;
          if (adjustedLine !== null) {
            pick = `${pick} ${adjustedLine > 0 ? "+" : ""}${adjustedLine}`;
          }
        }
      }

      // Mark only the column explicitly labeled Wildcard.
      if (pos === wildcardPos && pick) pick += " (wc)";

      let cellStyle = "";
      const colorPick = pick.replace(/\s*\(wc\)\s*/i, "").replace(/\s+[+-]\d+(?:\.\d+)?$/, "").trim();
      if (colorPick && winners.has(colorPick)) {
        cellStyle = "background-color: #32c98d;";
      } else if (colorPick && losers.has(colorPick)) {
        cellStyle = "background-color: #fc6799;";
      }

      return { confidence, pick, cellStyle };
    }).sort((a, b) => b.confidence - a.confidence);

    playerWeeks.push({ weekNum, picks, weeklyScore, weeklyRank, playerSeasonScore, seasonRank });
  });

  if (!playerWeeks.length) {
    container.innerHTML = "<p>No weekly data found for this participant.</p>";
    return;
  }

  const headers = ["Week", "Pick 7", "Pick 6", "Pick 5", "Pick 4", "Pick 3", "Pick 2", "Pick 1", "Week Score", "Weekly Rank", "Season Score", "Season Rank"];
  let html = "<table><thead><tr>" + headers.map(h => `<th>${escapeHTML(h)}</th>`).join("") + "</tr></thead><tbody>";
  playerWeeks.forEach(w => {
    html += `<tr><td>${w.weekNum}</td>`;
    w.picks.forEach(p => { html += `<td style="${p.cellStyle}">${escapeHTML(p.pick)}</td>`; });
    html += `<td>${w.weeklyScore}</td><td>${w.weeklyRank}</td><td>${w.playerSeasonScore}</td><td>${w.seasonRank}</td></tr>`;
  });
  html += "</tbody></table>";
  container.innerHTML = html;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

loadData();
</script>

</body>
</html>
