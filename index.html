
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Pick'em - Week 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: white;
    color: #222;
    margin: 25px;
  }

  h2 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 18px;
  }

  .table-container {
    width: 100%;
    max-width: 1350px;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    font-size: 14px;
    width: 100%;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 7px 5px;
    text-align: center;
    overflow-wrap: break-word;
  }

  th {
    background: #f2f2f2;
    font-weight: 600;
  }

  th:first-child, td:first-child {
    text-align: left;
    font-weight: 600;
    position: sticky;
    left: 0;
    background: white;
    width: 14%;
  }

  th:first-child {
    background: #f2f2f2;
  }

  tr:nth-child(even) td {
    background: #fafafa;
  }

  tr:nth-child(even) td:first-child {
    background: #fafafa;
  }

  /* Equal widths for game columns */
  .game-column {
    width: 8.5%;
  }

  /* Narrower confidence columns */
  .conf-column {
    width: 3.5%;
  }

  @media (max-width: 700px) {
    body {
      margin: 12px;
    }

    table {
      min-width: 1050px;
    }
  }
</style>
</head>

<body>

<h2>Week 1</h2>

<div id="table-container" class="table-container">
  Loading...
</div>

<script>
async function loadData() {
  const container = document.getElementById("table-container");

  try {
    const response = await fetch("data/data.json");

    if (!response.ok) {
      throw new Error("Unable to load spreadsheet data.");
    }

    const data = await response.json();

    const week = data.sheets.find(sheet => sheet.name === "Week 1");
    const users = data.sheets.find(sheet => sheet.name === "Users");

    if (!week) {
      throw new Error("Week 1 worksheet not found.");
    }

    const lastNames = {};

    if (users) {
      users.rows.forEach(row => {
        const username = String(row[0] || "").trim();
        const lastName = String(row[1] || "").trim();

        if (username && lastName) {
          lastNames[username] = lastName;
        }
      });
    }

    const headers = week.headers.slice(0, 15);
    const rows = week.rows;

    let html = "<table><colgroup>";

    headers.forEach((header, index) => {
      if (index === 0) {
        html += '<col style="width:14%">';
      } else if (String(header).trim().toLowerCase() === "conf") {
        html += '<col class="conf-column">';
      } else {
        html += '<col class="game-column">';
      }
    });

    html += "</colgroup><thead><tr>";

    headers.forEach((header, index) => {
      const heading = index === 0 ? "Last Name" : header;
      html += `<th>${escapeHTML(heading)}</th>`;
    });

    html += "</tr></thead><tbody>";

    rows.forEach(row => {
      html += "<tr>";

      for (let i = 0; i < 15; i++) {
        let value = row[i] || "";

        if (i === 0 && value) {
          value = lastNames[String(value).trim()] || value;
        }

        html += `<td>${escapeHTML(value)}</td>`;
      }

      html += "</tr>";
    });

    html += "</tbody></table>";

    container.innerHTML = html;

  } catch (error) {
    container.innerHTML =
      `<p style="color:#b00020">${escapeHTML(error.message)}</p>`;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

loadData();
</script>

</body>
</html>
