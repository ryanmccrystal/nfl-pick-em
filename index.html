
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Pick'em - Week 1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: white;
    color: #222;
    margin: 25px;
  }

  h2 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 18px;
  }

  .table-container {
    width: 100%;
    max-width: 1350px;
    margin: 0 auto;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    font-size: 14px;
    width: 100%;
    table-layout: fixed;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 3px 5px;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: break-word;
  }

  th {
    background: #f2f2f2;
    font-weight: 600;
  }

  th:first-child, td:first-child {
    text-align: left;
    font-weight: 600;
    position: sticky;
    left: 0;
    background: white;
    width: 14%;
  }

  th {
    cursor: pointer;
    user-select: none;
  }
  
  th:hover {
    background: #e5e5e5;
  }
  
  th.sorted-asc::after {
    content: " ▲";
    font-size: 10px;
  }
  
  th.sorted-desc::after {
    content: " ▼";
    font-size: 10px;
  }

  th:first-child {
    background: #f2f2f2;
  }

  tr:nth-child(even) td {
    background: #fafafa;
  }

  tr:nth-child(even) td:first-child {
    background: #fafafa;
  }

  /* Equal widths for game columns */
  .game-column {
    width: 5.5%;
  }

  /* Narrower confidence columns */
  .conf-column {
    width: 3.5%;
  }

  .tally-table {
    margin-top: 12px;
  }

  .wildcards {
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 18px;
    margin-left: 8px;
  }

  #week-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
  }
  
  #week-nav a {
    color: #333;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
  }
  
  #week-nav a:hover {
    text-decoration: underline;
  }
  
  #week-nav a.active {
    font-weight: 700;
    text-decoration: underline;
  }

  @media (max-width: 700px) {
    body {
      margin: 12px;
    }

    table {
      min-width: 1050px;
    }
  }
</style>
</head>

<body>

<nav id="week-nav"></nav>
<h2 id="week-title">Week 1</h2>

<div id="table-container" class="table-container">
  Loading...
</div>

<script>
async function loadData() {
  const container = document.getElementById("table-container");
  const requestedWeek = new URLSearchParams(window.location.search).get("week") || "1";

  const weekNumber =
    /^\d+$/.test(requestedWeek) &&
    Number(requestedWeek) >= 1 &&
    Number(requestedWeek) <= 18
      ? Number(requestedWeek)
      : 1;
  
  const weekName = "Week " + weekNumber;

  try {
    const response = await fetch("data/data.json");

    if (!response.ok) {
      throw new Error("Unable to load spreadsheet data.");
    }

    const data = await response.json();

    const week = data.sheets.find(sheet => sheet.name === weekName);
    // Update page heading
    document.getElementById("week-title").textContent = weekName;
    
    // Build week navigation
    const weekNav = document.getElementById("week-nav");
    
    weekNav.innerHTML = Array.from({ length: 18 }, (_, i) => {
      const number = i + 1;
    
      return `
        <a href="?week=${number}"
           class="${number === weekNumber ? 'active' : ''}">
           Week ${number}
        </a>
      `;
    }).join("");
    
    const users = data.sheets.find(sheet => sheet.name === "Users");

    if (!week) {
      throw new Error(weekName + " worksheet not found.");
    }

    const lastNames = {};

    if (users) {
      users.rows.forEach(row => {
        const username = String(row[0] || "").trim();
        const lastName = String(row[1] || "").trim();

        if (username && lastName) {
          lastNames[username] = lastName;
        }
      });
    }

    const headers = week.headers.slice(0, 16);
    const rows = week.rows;

    let html = "<table><colgroup>";

    headers.forEach((header, index) => {
      if (index === 0) {
        html += '<col style="width:14%">';
      } else if (String(header).trim().toLowerCase() === "conf" || index === 15) {
        html += '<col class="conf-column">';
      } else {
        html += '<col class="game-column">';
      }
    });

    html += "</colgroup><thead><tr>";

    headers.forEach((header, index) => {
      const heading = index === 0 ? "Last Name" : header;
      html += `<th data-column="${index}">${escapeHTML(heading)}</th>`;
    });

    html += "</tr></thead><tbody>";


    // Get game results from the entire worksheet
    const winners = new Set();
    const losers = new Set();
    
    rows.forEach(row => {
      const winner = String(row[18] || "").trim();
      const loser = String(row[19] || "").trim();
    
      if (winner) winners.add(winner);
      if (loser) losers.add(loser);
    });
    
    // Build participant rows
    rows.forEach(row => {
      html += "<tr>";
    
      for (let i = 0; i < 16; i++) {
        let value = row[i] || "";
        let cellStyle = "";
    
        // Replace username with last name
        if (i === 0 && value) {
          value = lastNames[String(value).trim()] || value;
        }
    
        // Color game picks based on results anywhere in S and T
        const isPickColumn = [1, 3, 5, 7, 9, 11, 13, 14].includes(i);
    
        if (isPickColumn && value) {
          const pick = String(value).trim();
    
          if (winners.has(pick)) {
            cellStyle = "background-color: #32c98d;";
          } else if (losers.has(pick)) {
            cellStyle = "background-color: #fc6799;";
          }
        }
    
        html += `<td style="${cellStyle}">${escapeHTML(value)}</td>`;
      }
    
      html += "</tr>";
    });



    html += "</tbody></table>";

    
    // Build Total Picks table
    const tallyGames = [
      { gameCol: 1, confCol: 2, teamCol: 22, countCol: 23 },
      { gameCol: 3, confCol: 4, teamCol: 24, countCol: 25 },
      { gameCol: 5, confCol: 6, teamCol: 26, countCol: 27 },
      { gameCol: 7, confCol: 8, teamCol: 28, countCol: 29 },
      { gameCol: 9, confCol: 10, teamCol: 30, countCol: 31 },
      { gameCol: 11, confCol: 12, teamCol: 32, countCol: 33 }
    ];

    const tallySourceRows = [rows[0] || [], rows[1] || []];

    html += '<table class="tally-table"><colgroup>';

    // Use exactly the same column widths as the picks table
    headers.forEach((header, index) => {
      if (index === 0) {
        html += '<col style="width:14%">';
      } else if (
        String(header).trim().toLowerCase() === "conf" || index === 15
      ) {
        html += '<col class="conf-column">';
      } else {
        html += '<col class="game-column">';
      }
    });

    html += '</colgroup><tbody>';

    tallySourceRows.forEach((sourceRow, rowIndex) => {
      html += '<tr>';
    
      for (let i = 0; i < 16; i++) {
        let value = "";
    
        if (i === 0 && rowIndex === 0) {
          value = "Pick Distribution";
        }

        const game = tallyGames.find(g => g.gameCol === i);
        const conf = tallyGames.find(g => g.confCol === i);

        if (game) {
          value = sourceRow[game.teamCol] || "";
        } else if (conf) {
          value = sourceRow[conf.countCol] || "";
        }

        html += `<td>${escapeHTML(value)}</td>`;
      }

      html += '</tr>';
    });

    html += '</tbody></table>';

    // Display Wildcards from cell W5
    const wildcards = rows[3]?.[22] || "";
    
    html += `<p class="wildcards"><strong>Wildcards:</strong> ${escapeHTML(wildcards)}</p>`;


    container.innerHTML = html;

    const table = container.querySelector("table");
    const tableHeaders = table.querySelectorAll("th");
    
    let currentSortColumn = -1;
    let sortAscending = true;
    
    tableHeaders.forEach(header => {
      header.addEventListener("click", () => {
        const column = Number(header.dataset.column);
    
        if (currentSortColumn === column) {
          sortAscending = !sortAscending;
        } else {
          currentSortColumn = column;
          sortAscending = true;
        }
    
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr"));
    
        rows.sort((a, b) => {
          const valueA = a.cells[column].textContent.trim();
          const valueB = b.cells[column].textContent.trim();
    
          if (!valueA) return 1;
          if (!valueB) return -1;
    
          const numberA = Number(valueA);
          const numberB = Number(valueB);
    
          let comparison;
    
          if (valueA !== "" && valueB !== "" &&
              !isNaN(numberA) && !isNaN(numberB)) {
            comparison = numberA - numberB;
          } else {
            comparison = valueA.localeCompare(valueB, undefined, {
              numeric: true,
              sensitivity: "base"
            });
          }
    
          return sortAscending ? comparison : -comparison;
        });
    
        rows.forEach(row => tbody.appendChild(row));
    
        tableHeaders.forEach(th => {
          th.classList.remove("sorted-asc", "sorted-desc");
        });
    
        header.classList.add(
          sortAscending ? "sorted-asc" : "sorted-desc"
        );
      });
    });

  } catch (error) {
    container.innerHTML =
      `<p style="color:#b00020">${escapeHTML(error.message)}</p>`;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

loadData();
</script>

</body>
</html>
